services:
  postgres:
    image: postgres:15-alpine
    container_name: riskgraph-postgres
    restart: always
    environment:
      POSTGRES_USER: riskgraph_user
      POSTGRES_PASSWORD: riskgraph_secret
      POSTGRES_DB: riskgraph_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskgraph_user -d riskgraph_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: riskgraph-backend
    restart: always
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=riskgraph_user
      - POSTGRES_PASSWORD=riskgraph_secret
      - POSTGRES_DB=riskgraph_db
      - DATABASE_URL=postgresql://riskgraph_user:riskgraph_secret@postgres:5432/riskgraph_db
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: riskgraph-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
